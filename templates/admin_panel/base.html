{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | فروش‌اینسایت</title>
    
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            font-family: 'Vazir', system-ui, sans-serif;
        }
        .sidebar {
            background: rgba(15, 23, 42, 0.8);
            /* backdrop-filter: blur(10px); */
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1rem;
            /* backdrop-filter: blur(4px); */
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(59,130,246,0.5);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            background: rgba(59,130,246,0.2);
            font-weight: bold;
        }
        tr:hover {
            background: rgba(255,255,255,0.03);
        }
    </style>
</head>
<body class="text-white">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="sidebar w-64 p-5 space-y-6">
            <div class="text-2xl font-bold gradient-text">فروش‌اینسایت</div>
            <nav class="space-y-2">
                <a href="{% url 'admin_panel:dashboard' %}" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/10 transition">
                    <i class="fas fa-tachometer-alt"></i> <span>داشبورد</span>
                </a>
                <a href="{% url 'admin_panel:user_list' %}" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/10 transition">
                    <i class="fas fa-users"></i> <span>کاربران</span>
                </a>
                <a href="{% url 'admin_panel:report_list' %}" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/10 transition">
                    <i class="fas fa-file-alt"></i> <span>گزارش‌ها</span>
                </a>
                <a href="/" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/10 transition mt-10">
                    <i class="fas fa-arrow-right"></i> <span>بازگشت به سایت</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
